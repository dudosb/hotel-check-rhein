<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Check Rhein</title>
<meta name="description" content="Hotel Check Rhein — Ihr digitaler Gästeservice">
<meta name="theme-color" content="#0e0f12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0e0f12;
    color: #e8e6e0;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
 
  /* HEADER */
  .header {
    background: linear-gradient(180deg, #1a1c20 0%, #14161a 100%);
    border-bottom: 1px solid rgba(201, 169, 110, 0.2);
    padding: 14px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .brand { display: flex; flex-direction: column; }
  .brand .hotel-name {
    font-family: 'Playfair Display', serif;
    color: #C9A96E;
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.3px;
  }
  .brand .tagline {
    color: #888;
    font-size: 11px;
    margin-top: 3px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .lang-select {
    background: rgba(201, 169, 110, 0.08);
    border: 1px solid rgba(201, 169, 110, 0.25);
    color: #e8e6e0;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    outline: none;
  }
  .lang-select:focus { border-color: #C9A96E; }
 
  /* EMERGENCY BANNER */
  .emergency {
    background: rgba(201, 169, 110, 0.06);
    border-bottom: 1px solid rgba(201, 169, 110, 0.15);
    padding: 8px 20px;
    font-size: 12px;
    color: #C9A96E;
    text-align: center;
    flex-shrink: 0;
    transition: all 0.3s ease;
  }
  .emergency.urgent {
    background: rgba(220, 38, 38, 0.12);
    border-bottom-color: rgba(220, 38, 38, 0.4);
    color: #fca5a5;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .emergency a { color: inherit; text-decoration: none; font-weight: 600; }
  .emergency a:hover { text-decoration: underline; }
 
  /* MESSAGES */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
 
  /* WELCOME SCREEN */
  .welcome {
    margin: auto 0;
    text-align: center;
    padding: 20px 0;
  }
  .welcome-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.9;
  }
  .welcome h2 {
    font-family: 'Playfair Display', serif;
    color: #C9A96E;
    font-size: 22px;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .welcome p {
    color: #aaa;
    font-size: 14px;
    line-height: 1.5;
    margin: 0 auto 24px;
    max-width: 320px;
  }
  .quick-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    max-width: 360px;
    margin: 0 auto;
  }
  .quick-btn {
    background: rgba(201, 169, 110, 0.06);
    border: 1px solid rgba(201, 169, 110, 0.2);
    color: #e8e6e0;
    padding: 14px 8px;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .quick-btn:hover, .quick-btn:active {
    background: rgba(201, 169, 110, 0.14);
    border-color: rgba(201, 169, 110, 0.5);
    transform: translateY(-1px);
  }
  .quick-btn .icon { font-size: 22px; }
  .quick-btn .title {
    color: #C9A96E;
    font-size: 13px;
    font-weight: 600;
  }
  .quick-btn .label {
    color: #888;
    font-size: 10.5px;
  }
 
  /* CHAT MESSAGES */
  .msg {
    padding: 11px 15px;
    border-radius: 14px;
    max-width: 85%;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    background: #C9A96E;
    color: #1a1c20;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }
  .msg.bot {
    background: #1f2126;
    border: 1px solid rgba(255, 255, 255, 0.04);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .typing {
    color: #888;
    font-style: italic;
    opacity: 0.7;
  }
  .typing::after {
    content: '';
    display: inline-block;
    width: 4px;
    height: 4px;
    background: #888;
    border-radius: 50%;
    margin-left: 4px;
    animation: typing 1.4s infinite;
  }
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.3; }
    30% { opacity: 1; }
  }
 
  /* BACK BUTTON */
  .back-row {
    display: flex;
    justify-content: center;
    padding: 4px 0 0;
  }
  .back-btn {
    background: none;
    border: 1px solid rgba(201, 169, 110, 0.3);
    color: #C9A96E;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 11.5px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .back-btn:hover {
    background: rgba(201, 169, 110, 0.08);
    border-color: rgba(201, 169, 110, 0.5);
  }
 
  /* INPUT AREA */
  .input-area {
    background: #14161a;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .input-area input {
    flex: 1;
    background: #1f2126;
    border: 1px solid rgba(201, 169, 110, 0.2);
    color: #e8e6e0;
    padding: 12px 16px;
    border-radius: 24px;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-area input::placeholder { color: #666; }
  .input-area input:focus { border-color: #C9A96E; }
  .input-area button {
    background: #C9A96E;
    color: #1a1c20;
    border: none;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .input-area button:hover:not(:disabled) { transform: scale(1.05); }
  .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }
  .input-area button svg { width: 20px; height: 20px; }
 
  /* FOOTER */
  .footer-note {
    text-align: center;
    color: #555;
    font-size: 10.5px;
    padding: 8px 16px 4px;
    background: #14161a;
    flex-shrink: 0;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="hotel-name">Hotel Check Rhein</span>
      <span class="tagline" id="tagline">Digitaler Concierge</span>
    </div>
    <select class="lang-select" id="language" onchange="changeLanguage()" aria-label="Language">
      <option value="de">🇩🇪 DE</option>
      <option value="en">🇬🇧 EN</option>
      <option value="fr">🇫🇷 FR</option>
      <option value="nl">🇳🇱 NL</option>
      <option value="es">🇪🇸 ES</option>
      <option value="hr">🇭🇷 HR</option>
      <option value="uk">🇺🇦 UK</option>
    </select>
  </div>
 
  <div class="emergency" id="emergency">
    <span id="emergency-text"></span>
    <a href="tel:+4983317851790">+49 8331 7851790</a>
  </div>
 
  <div class="messages" id="messages"></div>
 
  <div class="input-area">
    <input id="input" type="text" autocomplete="off" onkeypress="if(event.key==='Enter')send()">
    <button onclick="send()" id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
 
  <div class="footer-note">Powered by AI · Hotel Check Rhein © 2026</div>
 
<script>
  const WEBHOOK = 'https://welmora.app.n8n.cloud/webhook/hotel-chat';
 
  // ============ I18N DICTIONARY ============
  const I18N = {
    de: {
      tagline: 'Digitaler Concierge',
      welcomeTitle: 'Willkommen im Hotel Check Rhein',
      welcomeText: 'Wie kann ich Ihnen helfen? Fragen Sie mich zu Buchung, Check-in, WLAN, Parken, Verlängerung oder allem rund um Ihren Aufenthalt.',
      emergencyText: 'Notfall? Manager anrufen: ',
      placeholder: 'Nachricht schreiben...',
      thinking: 'Schreibt',
      backBtn: '↩ Zurück zum Start',
      networkError: 'Leider gab es einen Fehler. Bitte versuchen Sie es erneut oder rufen Sie den Manager an.',
      actions: [
        { icon: '📶', title: 'WLAN', label: 'Passwort & Setup', msg: 'Wie ist das WLAN-Passwort?' },
        { icon: '🅿️', title: 'Parken', label: 'Standort & Zugang', msg: 'Wo kann ich parken?' },
        { icon: '🔑', title: 'Zimmer', label: 'PIN & Zugang', msg: 'Wie komme ich in mein Zimmer?' },
        { icon: '🕐', title: 'Check-out', label: 'Zeit & Ablauf', msg: 'Bis wann ist der Check-out?' },
        { icon: '📅', title: 'Buchung', label: 'Ablauf & Bezahlung', msg: 'Wie kann ich ein Zimmer buchen?' },
        { icon: '➕', title: 'Verlängern', label: 'Aufenthalt verlängern', msg: 'Wie kann ich meine Buchung verlängern?' }
      ]
    },
    en: {
      tagline: 'Digital Concierge',
      welcomeTitle: 'Welcome to Hotel Check Rhein',
      welcomeText: 'How can I help you? Ask me about booking, check-in, WiFi, parking, extending your stay, or anything about your stay.',
      emergencyText: 'Emergency? Call manager: ',
      placeholder: 'Write a message...',
      thinking: 'Typing',
      backBtn: '↩ Back to start',
      networkError: 'Sorry, there was a problem. Please try again or call the manager.',
      actions: [
        { icon: '📶', title: 'WiFi', label: 'Password & setup', msg: 'What is the WiFi password?' },
        { icon: '🅿️', title: 'Parking', label: 'Location & access', msg: 'Where can I park?' },
        { icon: '🔑', title: 'Room entry', label: 'PIN & access', msg: 'How do I get into my room?' },
        { icon: '🕐', title: 'Check-out', label: 'Time & procedure', msg: 'What time is check-out?' },
        { icon: '📅', title: 'Booking', label: 'Process & payment', msg: 'How can I book a room?' },
        { icon: '➕', title: 'Extend stay', label: 'Stay longer', msg: 'How can I extend my booking?' }
      ]
    },
    fr: {
      tagline: 'Concierge Numérique',
      welcomeTitle: 'Bienvenue à l\u2019Hôtel Check Rhein',
      welcomeText: 'Comment puis-je vous aider ? Posez-moi une question sur la réservation, le check-in, le WiFi, le parking, la prolongation ou tout autre sujet.',
      emergencyText: 'Urgence ? Appelez le manager : ',
      placeholder: 'Écrivez un message...',
      thinking: 'Écrit',
      backBtn: '↩ Retour au début',
      networkError: 'Désolé, une erreur s\u2019est produite. Veuillez réessayer ou appeler le manager.',
      actions: [
        { icon: '📶', title: 'WiFi', label: 'Mot de passe', msg: 'Quel est le mot de passe WiFi ?' },
        { icon: '🅿️', title: 'Parking', label: 'Emplacement', msg: 'Où puis-je me garer ?' },
        { icon: '🔑', title: 'Chambre', label: 'PIN & accès', msg: 'Comment entrer dans ma chambre ?' },
        { icon: '🕐', title: 'Check-out', label: 'Heure & procédure', msg: 'À quelle heure est le check-out ?' },
        { icon: '📅', title: 'Réservation', label: 'Processus & paiement', msg: 'Comment réserver une chambre ?' },
        { icon: '➕', title: 'Prolonger', label: 'Prolonger le séjour', msg: 'Comment puis-je prolonger ma réservation ?' }
      ]
    },
    nl: {
      tagline: 'Digitale Concierge',
      welcomeTitle: 'Welkom in Hotel Check Rhein',
      welcomeText: 'Hoe kan ik u helpen? Stel een vraag over boeking, check-in, WiFi, parkeren, verlengen of alles rond uw verblijf.',
      emergencyText: 'Noodgeval? Bel de manager: ',
      placeholder: 'Schrijf een bericht...',
      thinking: 'Schrijft',
      backBtn: '↩ Terug naar start',
      networkError: 'Sorry, er ging iets mis. Probeer het opnieuw of bel de manager.',
      actions: [
        { icon: '📶', title: 'WiFi', label: 'Wachtwoord', msg: 'Wat is het WiFi-wachtwoord?' },
        { icon: '🅿️', title: 'Parkeren', label: 'Locatie & toegang', msg: 'Waar kan ik parkeren?' },
        { icon: '🔑', title: 'Kamer', label: 'PIN & toegang', msg: 'Hoe kom ik in mijn kamer?' },
        { icon: '🕐', title: 'Check-out', label: 'Tijd & procedure', msg: 'Hoe laat is de check-out?' },
        { icon: '📅', title: 'Boeking', label: 'Proces & betaling', msg: 'Hoe kan ik een kamer boeken?' },
        { icon: '➕', title: 'Verlengen', label: 'Verblijf verlengen', msg: 'Hoe kan ik mijn boeking verlengen?' }
      ]
    },
    es: {
      tagline: 'Conserje Digital',
      welcomeTitle: 'Bienvenido a Hotel Check Rhein',
      welcomeText: '¿En qué puedo ayudarle? Pregúnteme sobre reservas, check-in, WiFi, aparcamiento, prolongar la estancia o cualquier otra cosa.',
      emergencyText: '¿Emergencia? Llame al manager: ',
      placeholder: 'Escribe un mensaje...',
      thinking: 'Escribiendo',
      backBtn: '↩ Volver al inicio',
      networkError: 'Lo sentimos, hubo un problema. Inténtelo de nuevo o llame al manager.',
      actions: [
        { icon: '📶', title: 'WiFi', label: 'Contraseña', msg: '¿Cuál es la contraseña del WiFi?' },
        { icon: '🅿️', title: 'Aparcamiento', label: 'Ubicación', msg: '¿Dónde puedo aparcar?' },
        { icon: '🔑', title: 'Habitación', label: 'PIN & acceso', msg: '¿Cómo entro a mi habitación?' },
        { icon: '🕐', title: 'Check-out', label: 'Hora', msg: '¿A qué hora es el check-out?' },
        { icon: '📅', title: 'Reserva', label: 'Proceso & pago', msg: '¿Cómo puedo reservar una habitación?' },
        { icon: '➕', title: 'Prolongar', label: 'Alargar estancia', msg: '¿Cómo puedo prolongar mi reserva?' }
      ]
    },
    hr: {
      tagline: 'Digitalni Concierge',
      welcomeTitle: 'Dobrodošli u Hotel Check Rhein',
      welcomeText: 'Kako vam mogu pomoći? Pitajte me o rezervaciji, check-inu, WiFi-u, parkingu, produženju boravka ili bilo čemu drugom.',
      emergencyText: 'Hitan slučaj? Nazovite managera: ',
      placeholder: 'Napišite poruku...',
      thinking: 'Piše',
      backBtn: '↩ Natrag na početak',
      networkError: 'Nažalost došlo je do greške. Molimo pokušajte ponovno ili nazovite managera.',
      actions: [
        { icon: '📶', title: 'WiFi', label: 'Lozinka', msg: 'Koja je WiFi lozinka?' },
        { icon: '🅿️', title: 'Parking', label: 'Lokacija & pristup', msg: 'Gdje mogu parkirati?' },
        { icon: '🔑', title: 'Soba', label: 'PIN & pristup', msg: 'Kako da uđem u sobu?' },
        { icon: '🕐', title: 'Check-out', label: 'Vrijeme & postupak', msg: 'Do koliko sati je check-out?' },
        { icon: '📅', title: 'Rezervacija', label: 'Postupak & plaćanje', msg: 'Kako mogu rezervirati sobu?' },
        { icon: '➕', title: 'Produžiti', label: 'Produžiti boravak', msg: 'Kako mogu produžiti rezervaciju?' }
      ]
    },
    uk: {
      tagline: 'Цифровий Консьєрж',
      welcomeTitle: 'Ласкаво просимо до Hotel Check Rhein',
      welcomeText: 'Чим я можу допомогти? Запитайте про бронювання, заїзд, WiFi, парковку, продовження або будь-що інше.',
      emergencyText: 'Екстрений випадок? Зателефонуйте менеджеру: ',
      placeholder: 'Напишіть повідомлення...',
      thinking: 'Пише',
      backBtn: '↩ Назад до початку',
      networkError: 'Вибачте, сталася помилка. Спробуйте ще раз або зателефонуйте менеджеру.',
      actions: [
        { icon: '📶', title: 'WiFi', label: 'Пароль', msg: 'Який пароль WiFi?' },
        { icon: '🅿️', title: 'Парковка', label: 'Розташування', msg: 'Де я можу припаркуватися?' },
        { icon: '🔑', title: 'Кімната', label: 'PIN та доступ', msg: 'Як потрапити до кімнати?' },
        { icon: '🕐', title: 'Виїзд', label: 'Час та порядок', msg: 'О котрій годині виїзд?' },
        { icon: '📅', title: 'Бронювання', label: 'Процес та оплата', msg: 'Як забронювати номер?' },
        { icon: '➕', title: 'Продовжити', label: 'Подовжити перебування', msg: 'Як можна продовжити бронювання?' }
      ]
    }
  };
 
  let currentLang = 'de';
  let sessionId = 'session_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
  let hasMessages = false;
 
  function t(key) {
    return I18N[currentLang][key] || I18N.en[key] || '';
  }
 
  function applyTranslations() {
    document.documentElement.lang = currentLang;
    document.getElementById('tagline').textContent = t('tagline');
    document.getElementById('emergency-text').textContent = t('emergencyText');
    document.getElementById('input').placeholder = t('placeholder');
    if (!hasMessages) showWelcome();
  }
 
  function showWelcome() {
    const data = I18N[currentLang];
    const messages = document.getElementById('messages');
    messages.innerHTML = `
      <div class="welcome">
        <div class="welcome-icon">🏨</div>
        <h2>${data.welcomeTitle}</h2>
        <p>${data.welcomeText}</p>
        <div class="quick-actions">
          ${data.actions.map(a => `
            <button class="quick-btn" onclick="quickSend('${a.msg.replace(/'/g, "\\'")}')">
              <span class="icon">${a.icon}</span>
              <span class="title">${a.title}</span>
              <span class="label">${a.label}</span>
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }
 
  function changeLanguage() {
    currentLang = document.getElementById('language').value;
    applyTranslations();
  }
 
  function resetChat() {
    sessionId = 'session_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
    hasMessages = false;
    setEmergencyUrgent(false);
    showWelcome();
    document.getElementById('input').focus();
  }
 
  function addMsg(text, cls) {
    if (!hasMessages) {
      document.getElementById('messages').innerHTML = '';
      hasMessages = true;
    }
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    messages.appendChild(div);
 
    // Add back button only once, after first message
    if (!document.getElementById('back-row')) {
      const backRow = document.createElement('div');
      backRow.id = 'back-row';
      backRow.className = 'back-row';
      backRow.innerHTML = `<button class="back-btn" onclick="resetChat()">${t('backBtn')}</button>`;
      messages.appendChild(backRow);
    }
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return div;
  }
 
  function setEmergencyUrgent(urgent) {
    const el = document.getElementById('emergency');
    if (urgent) el.classList.add('urgent');
    else el.classList.remove('urgent');
  }
 
  function quickSend(text) {
    document.getElementById('input').value = text;
    send();
  }
 
  async function send() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;
 
    addMsg(text, 'user');
    input.value = '';
    document.getElementById('sendBtn').disabled = true;
 
    const typingMsg = addMsg(t('thinking'), 'bot typing');
 
    try {
      const payload = {
        message: text,
        sessionId: sessionId,
        language: currentLang
      };
 
      const res = await fetch(WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
 
      const data = await res.json();
      typingMsg.remove();
 
      if (!res.ok) {
        addMsg(t('networkError'), 'bot');
        setEmergencyUrgent(true);
      } else {
        addMsg(data.reply || '...', 'bot');
        if (data.escalate === true || data.escalate === 'true') {
          setEmergencyUrgent(true);
        }
      }
 
    } catch (err) {
      typingMsg.remove();
      addMsg(t('networkError'), 'bot');
      setEmergencyUrgent(true);
    } finally {
      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }
  }
 
  // Initialize on load
  document.getElementById('language').value = 'de';
  applyTranslations();
  showWelcome();
  document.getElementById('input').focus();
</script>
</body>
</html>
